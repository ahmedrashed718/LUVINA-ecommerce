<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: "Poppins", sans-serif;
      }

      .login-container {
        max-width: 900px;
        min-height: 500px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
        display: flex;
      }

      .model-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .form-container {
        flex: 1;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .luvina-img {
        display: block;
        max-width: 130px;
        margin: 0 auto 25px;
      }

      .sign-btn {
        width: 100%;
        padding: 10px;
        background: linear-gradient(135deg, #6c63ff, #5a55ff);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }

      .sign-btn:hover {
        background: linear-gradient(135deg, #5a55ff, #4b47e0);
        transform: translateY(-2px);
      }

      .invalid-feedback {
        display: none;
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 5px;
      }

      .back-link {
        text-align: center;
        margin-top: 15px;
      }

      .back-link span {
        color: #6c63ff;
        cursor: pointer;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
        }
        .model-img {
          display: none;
        }
        .form-container {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <!-- Left Image -->
      <div class="col-lg-5 d-none d-lg-block">
        <img src="../assets/images/Model.jpg" alt="Model" class="model-img" />
      </div>

      <!-- Right Form -->
      <div class="form-container">
        <img src="../assets/images/logotype.png" alt="" class="luvina-img" />

        <h4 class="text-center mb-4 fw-semibold">Reset Your Password</h4>
        <p class="text-center text-muted mb-4">
          Enter your registered email, and we’ll send you a reset link.
        </p>

        <form id="resetForm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="someone@gmail.com"
              required
            />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <div
            id="resetMessage"
            class="alert text-center py-2"
            style="display: none"
          ></div>

          <button class="sign-btn" type="submit">Send Reset Link</button>
        </form>

        <div class="back-link">
          <span id="goBack">← Back to Login</span>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("resetForm");
      const emailInput = document.getElementById("email");
      const message = document.getElementById("resetMessage");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        message.style.display = "none";
        emailInput.nextElementSibling.style.display = "none";

        const emailValue = emailInput.value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(emailValue)) {
          emailInput.nextElementSibling.style.display = "block";
          return;
        }

        const users = JSON.parse(localStorage.getItem("users")) || [];
        const user = users.find((u) => u.email === emailValue);

        if (user) {
          localStorage.setItem("resetEmail", emailValue);

          window.location.href = "VerifyOTP.html";
        } else {
          message.textContent = "❌ Email not found in our records.";
          message.className = "alert alert-danger text-center py-2";
          message.style.display = "block";
        }
      });

      document
        .getElementById("goBack")
        .addEventListener(
          "click",
          () => (window.location.href = "Login-Customer.html")
        );
    </script>
  </body>
</html>
