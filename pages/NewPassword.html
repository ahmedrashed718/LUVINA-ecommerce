<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set New Password</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: "Poppins", sans-serif;
      }

      .login-container {
        max-width: 900px;
        min-height: 500px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
        display: flex;
      }

      .model-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .form-container {
        flex: 1;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .luvina-img {
        display: block;
        max-width: 130px;
        margin: 0 auto 25px;
      }

      .sign-btn {
        width: 100%;
        padding: 10px;
        background: linear-gradient(135deg, #6c63ff, #5a55ff);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }

      .sign-btn:hover {
        background: linear-gradient(135deg, #5a55ff, #4b47e0);
        transform: translateY(-2px);
      }

      .invalid-feedback {
        display: none;
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 5px;
      }

      .back-link {
        text-align: center;
        margin-top: 15px;
      }

      .back-link span {
        color: #6c63ff;
        cursor: pointer;
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
        }
        .model-img {
          display: none;
        }
        .form-container {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <div class="col-lg-5 d-none d-lg-block">
        <img src="../assets/images/Model.jpg" alt="Model" class="model-img" />
      </div>

      <div class="form-container">
        <img src="../assets/images/logotype.png" alt="" class="luvina-img" />
        <h4 class="text-center mb-4 fw-semibold">Set New Password</h4>
        <p class="text-center text-muted mb-4">
          Enter your new password below to reset your account.
        </p>

        <form id="newPasswordForm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">New Password</label>
            <input
              type="password"
              class="form-control"
              id="newPassword"
              placeholder="At least 8 characters"
              minlength="8"
              required
            />
            <div class="invalid-feedback">
              Password must be at least 8 characters long.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              placeholder="Re-enter your new password"
              required
            />
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>

          <div
            id="resetMessage"
            class="alert text-center py-2"
            style="display: none"
          ></div>

          <button class="sign-btn" type="submit">Save Password</button>
        </form>

        <div class="back-link">
          <span id="goBack">← Back to Login</span>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("newPasswordForm");
      const newPassword = document.getElementById("newPassword");
      const confirmPassword = document.getElementById("confirmPassword");
      const message = document.getElementById("resetMessage");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        message.style.display = "none";
        newPassword.nextElementSibling.style.display = "none";
        confirmPassword.nextElementSibling.style.display = "none";

        let valid = true;

        if (newPassword.value.trim().length < 8) {
          newPassword.nextElementSibling.style.display = "block";
          valid = false;
        }

        if (newPassword.value.trim() !== confirmPassword.value.trim()) {
          confirmPassword.nextElementSibling.style.display = "block";
          valid = false;
        }

        if (!valid) return;

        const resetEmail = localStorage.getItem("resetEmail");
        if (!resetEmail) {
          message.textContent = "⚠️ No account found for password reset.";
          message.className = "alert alert-danger text-center py-2";
          message.style.display = "block";
          return;
        }

        let users = JSON.parse(localStorage.getItem("users")) || [];
        const index = users.findIndex((u) => u.email === resetEmail);

        if (index === -1) {
          message.textContent = "❌ Account not found.";
          message.className = "alert alert-danger text-center py-2";
          message.style.display = "block";
          return;
        }

        users[index].password = newPassword.value.trim();
        localStorage.setItem("users", JSON.stringify(users));

        message.textContent = "✅ Password reset successfully!";
        message.className = "alert alert-success text-center py-2";
        message.style.display = "block";

        setTimeout(() => {
          localStorage.removeItem("resetEmail");
          localStorage.removeItem("otp");
          window.location.href = "Login-Customer.html";
        }, 2000);
      });

      document
        .getElementById("goBack")
        .addEventListener(
          "click",
          () => (window.location.href = "Login-Customer.html")
        );
    </script>
  </body>
</html>
