<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: "Poppins", sans-serif;
      }
      .login-container {
        max-width: 900px;
        min-height: 500px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
        display: flex;
      }
      .model-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .form-container {
        flex: 1;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .luvina-img {
        display: block;
        max-width: 130px;
        margin: 0 auto 25px;
      }
      .sign-btn {
        width: 100%;
        padding: 10px;
        background: linear-gradient(135deg, #6c63ff, #5a55ff);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }
      .sign-btn:hover {
        background: linear-gradient(135deg, #5a55ff, #4b47e0);
        transform: translateY(-2px);
      }
      .dont-have {
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
      }
      .dont-have span {
        font-weight: 600;
        color: #6c63ff;
        cursor: pointer;
      }
      .invalid-feedback {
        display: none;
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 5px;
      }
      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
          height: auto;
        }
        .model-img {
          display: none;
        }
        .form-container {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="col-lg-5 d-none d-lg-block">
        <img src="../assets/images/Model.jpg" alt="Model" class="model-img" />
      </div>
      <div class="form-container">
        <img src="../assets/images/logotype.png" alt="" class="luvina-img" />
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="someone@gmail.com"
              required
            />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="Enter your password"
              required
            />
            <div class="invalid-feedback">Please enter your password.</div>
          </div>
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">
                Remember Me
              </label>
            </div>
            <div class="text-end mb-3">
              <a
                href="ResetPassword.html"
                class="text-decoration-none fw-semibold"
                style="color: #6c63ff"
              >
                Forget password?
              </a>
            </div>
          </div>
          <div
            id="loginError"
            class="alert alert-danger text-center py-2"
            style="display: none"
          >
            Invalid email or password
          </div>
          <button class="sign-btn" type="submit">Sign In</button>
        </form>
        <div class="dont-have">
          Don't have an account? <span id="goToSignup">Register</span>
        </div>
      </div>
    </div>
    <script>
      const form = document.getElementById("loginForm");
      const emailInput = document.getElementById("email");
      const passwordInput = document.getElementById("password");
      const loginError = document.getElementById("loginError");
      const savedEmail = localStorage.getItem("rememberedEmail");
      if (savedEmail) {
        emailInput.value = savedEmail;
        document.getElementById("rememberMe").checked = true;
      }
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        loginError.style.display = "none";
        let isValid = true;
        if (!emailInput.value.trim()) {
          emailInput.nextElementSibling.style.display = "block";
          isValid = false;
        } else {
          emailInput.nextElementSibling.style.display = "none";
        }
        if (!passwordInput.value.trim()) {
          passwordInput.nextElementSibling.style.display = "block";
          isValid = false;
        } else {
          passwordInput.nextElementSibling.style.display = "none";
        }
        if (!isValid) return;
        const users = JSON.parse(localStorage.getItem("users")) || [];
        const user = users.find(
          (u) =>
            u.email === emailInput.value.trim() &&
            u.password === passwordInput.value.trim()
        );
        if (user) {
          if (user.status && user.status !== 'active') {
            loginError.textContent = "Your account has been suspended. Please contact admin.";
            loginError.style.display = "block";
            return;
          }
          const rememberMe = document.getElementById("rememberMe").checked;
          if (rememberMe) {
            localStorage.setItem("rememberedEmail", emailInput.value.trim());
          } else {
            localStorage.removeItem("rememberedEmail");
          }
          localStorage.setItem("loggedInUser", JSON.stringify(user));
          localStorage.setItem("isLoggedIn", "true");
          const accountType = user.accountType || 'customer';
          if (accountType === 'admin') {
            window.location.href = "../admin/dashboard .html";
          } else if (accountType === 'business') {
            window.location.href = "../Seller/sellerDashboard.html";
          } else {
            window.location.href = "../Home.html";
          }
        } else {
          loginError.textContent = "Invalid email or password";
          loginError.style.display = "block";
        }
      });
      document
        .getElementById("goToSignup")
        .addEventListener(
          "click",
          () => (window.location.href = "Signup-Customer.html")
        );
    </script>
    <script src="../js/user-manager.js"></script>
  </body>
</html>
