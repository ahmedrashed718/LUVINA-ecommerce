<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        /* font-family: "Poppins", sans-serif; */
        background: linear-gradient(135deg, #e3f2fd, #f3e5f5);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        max-width: 900px;
        min-height: 600px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.15);
        display: flex;
      }

      .model-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .form-container {
        flex: 1;
        padding: 30px 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .luvina-img {
        display: block;
        max-width: 130px;
        margin: 0 auto 25px;
      }

      .sign-btn {
        width: 100%;
        padding: 10px;
        background: linear-gradient(135deg, #6c63ff, #5a55ff);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 8px;
      }

      .sign-btn:hover {
        background: linear-gradient(135deg, #5a55ff, #4b47e0);
        transform: translateY(-2px);
      }

      .dont-have {
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
      }

      .dont-have span {
        font-weight: 600;
        color: #6c63ff;
        cursor: pointer;
      }

      .invalid-feedback {
        display: none;
        color: #dc3545;
        font-size: 0.9rem;
        margin-top: 5px;
      }

      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
          height: auto;
        }

        .model-img {
          display: none;
        }

        .form-container {
          padding: 20px;
        }
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <!-- Left Image -->
      <div class="col-lg-5 d-none d-lg-block">
        <img src="../assets/images/Model.jpg" alt="Model" class="model-img" />
      </div>

      <!-- Right Form -->
      <div class="form-container">
        <img src="../assets/images/logotype.png" alt="" class="luvina-img" />

        <form id="signupForm" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="fullname"
              placeholder="Enter your name"
              required
            />
            <div class="invalid-feedback">Please enter a valid full name.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Phone Number</label>
            <input
              type="text"
              class="form-control"
              id="phone"
              placeholder="Enter your phone number"
              pattern="^01[0-9]{9}$"
              required
            />
            <div class="invalid-feedback">
              Please enter a valid phone number
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              placeholder="someone@gmail.com"
              required
            />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="At least 8 characters"
              minlength="8"
              required
            />
            <div class="invalid-feedback">
              Password must be at least 8 characters.
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Confirm Password</label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              placeholder="Confirm your password"
              required
            />
            <div class="invalid-feedback">Passwords do not match.</div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Account Type</label>
            <select class="form-select" id="accountType" required>
              <option value="customer">Customer Account</option>
              <option value="business">Business Account (Sell Products)</option>
            </select>
            <small class="text-muted">Business accounts can list and sell products on the platform.</small>
          </div>

          <button class="sign-btn" type="submit">Sign Up</button>
        </form>

        <div class="dont-have">
          Already have an account? <span id="goToLogin">Sign in</span>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById("signupForm");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const inputs = form.querySelectorAll("input");
        inputs.forEach((input) => {
          input.nextElementSibling.style.display = "none";
        });

        let isValid = true;

        const fullname = document.getElementById("fullname");
        const phone = document.getElementById("phone");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");

        // Fullname Validation
        if (fullname.value.trim().length < 3) {
          fullname.nextElementSibling.style.display = "block";
          isValid = false;
        }

        // Phone Validation
        const phoneRegex = /^01[0-9]{9}$/;
        if (!phoneRegex.test(phone.value.trim())) {
          phone.nextElementSibling.style.display = "block";
          isValid = false;
        }

        // Email Validation
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email.value.trim())) {
          email.nextElementSibling.style.display = "block";
          isValid = false;
        }

        // Password Validation
        if (password.value.trim().length < 8) {
          password.nextElementSibling.style.display = "block";
          isValid = false;
        }

        // Confirm Password
        if (confirmPassword.value.trim() !== password.value.trim()) {
          confirmPassword.nextElementSibling.style.display = "block";
          isValid = false;
        }

        if (!isValid) return;

        // Save to localStorage
        let users = JSON.parse(localStorage.getItem("users")) || [];
        if (users.find((u) => u.email === email.value.trim())) {
          email.nextElementSibling.textContent = "Email already registered.";
          email.nextElementSibling.style.display = "block";
          return;
        }

        const accountType = document.getElementById("accountType").value;
        
        users.push({
          fullname: fullname.value.trim(),
          phone: phone.value.trim(),
          email: email.value.trim(),
          password: password.value.trim(),
          accountType: accountType,
          createdAt: new Date().toISOString(),
          status: 'active'
        });
        localStorage.setItem("users", JSON.stringify(users));

        // Success
        const btn = form.querySelector(".sign-btn");
        btn.textContent = "Account Created!";
        btn.style.background = "#28a745";
        setTimeout(() => (window.location.href = "Login-Customer.html"), 1500);
      });

      document.getElementById("goToLogin").addEventListener("click", () => {
        window.location.href = "Login-Customer.html";
      });
    </script>
    <script src="../js/user-manager.js"></script>
  </body>
</html>
