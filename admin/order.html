<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin orders</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
     <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="admin.css">
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
          <div class="sidebar d-flex flex-column" id="sidebar">
        <div class="logo text-center my-3">
          <a href="../Home.html" style="text-decoration: none;">
            <img
              src="../assets/images/Luvina-logo-navbar.svg"
              alt="LUVINA Logo"
              width="170"
              style="cursor: pointer;"
            />
          </a>
          <p class="text-center text-secondary mb-0">admin panel</p>
        </div>
        <a href="./dashboard .html" ><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="./order.html" class="active"><i class="bi bi-bag"></i> Orders</a>
        <a href="./products.html" ><i class="bi bi-box-seam"></i> Products</a>
        <a href="./seller-product-approval.html"><i class="bi bi-check2-circle"></i> Product Approval</a>
        <a href="./user-management.html"><i class="bi bi-people"></i> Users</a>
        <a href="./customerService.html" ><i class="bi bi-chat-left-text"></i> Customer service</a>
        <button class="logout-btn mt-auto" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right text-white"></i> Logout</button>
      </div>
 <div class="main-content" id="main-content">
  <button class="btn btn-light d-md-none mb-3" id="menu-toggle">
        <i class="bi bi-list fs-3"></i>
      </button>
   <div id="order" class="container-fluid py-3 mx-0 bg-white">
      <div class="d-flex justify-content-between">
          <div class="col-md-6">
          <h2 class="head">Orders</h2>
           </div>
          <div class="col-md-6 search">
            <input type="text" class="form-control w-75" placeholder="Search here...">
          </div>
    </div>
      </div>
          <div class="table-responsive mx-2 my-2 px-2 rounded bg-white">
                <p class="text-muted">Here's your store's performance summary</p>
            <table class="table align-middle ">
              <thead>
                <tr>
                  <th>Order ID</th>
                  <th>Customer Name</th>
                  <th>Email</th>
                  <th>Date</th>
                  <th>Total Price</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="ordersTableBody">
                <tr>
                  <td colspan="7" class="text-center py-4">
                    <div class="spinner-border text-primary" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2 text-muted">Loading orders...</p>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          <div id="emptyOrders" class="text-center py-5" style="display: none;">
            <i class="bi bi-cart-x" style="font-size: 3rem; color: #ccc;"></i>
            <p class="text-muted mt-3">No orders found</p>
          </div>
        </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/admin-data-manager.js"></script>
<script src="../js/user-manager.js"></script>
<script src="../js/order-manager.js"></script>
<script src="./mainAdmin.js"></script>
<script>
  if (!isAdmin()) {
    alert('Access Denied: Admin only');
    window.location.href = '../pages/Login-Customer.html';
  }
  document.addEventListener('DOMContentLoaded', function() {
    loadAllOrders();
  });
  function loadAllOrders() {
    const orders = adminDataManager.getAllOrdersForAdmin();
    const tbody = document.getElementById('ordersTableBody');
    const emptyState = document.getElementById('emptyOrders');
    if (orders.length === 0) {
      tbody.parentElement.style.display = 'none';
      emptyState.style.display = 'block';
      return;
    }
    tbody.innerHTML = '';
    orders.sort((a, b) => new Date(b.orderDate) - new Date(a.orderDate));
    orders.forEach(order => {
      const statusClass = getStatusClass(order.status);
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${order.orderNumber}</strong></td>
        <td>${order.customerName}</td>
        <td>${order.email}</td>
        <td>${adminDataManager.formatDateAdmin(order.orderDate)}</td>
        <td><strong>${adminDataManager.formatCurrency(order.total)}</strong></td>
        <td>
          <select class="form-select form-select-sm status-select ${statusClass}" 
                  data-order="${order.orderNumber}" 
                  onchange="updateOrderStatus(this)">
            <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
            <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
            <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
            <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
            <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
          </select>
        </td>
        <td>
          <button class="btn btn-sm btn-info" onclick="viewOrderDetails('${order.orderNumber}')">
            <i class="bi bi-eye"></i>
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteOrder('${order.orderNumber}')">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      `;
      tbody.appendChild(row);
    });
  }
  function getStatusClass(status) {
    const classes = {
      'Pending': 'pending',
      'Processing': 'shipped',
      'Shipped': 'shipped',
      'Delivered': 'delivered',
      'Cancelled': 'canceled'
    };
    return classes[status] || '';
  }
  function updateOrderStatus(selectElement) {
    const orderNumber = selectElement.dataset.order;
    const newStatus = selectElement.value;
    if (adminDataManager.updateOrderStatusAdmin(orderNumber, newStatus)) {
      Swal.fire({
        icon: 'success',
        title: 'Status Updated!',
        text: `Order ${orderNumber} status changed to ${newStatus}`,
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 3000
      });
      selectElement.className = 'form-select form-select-sm status-select ' + getStatusClass(newStatus);
    } else {
      Swal.fire({
        icon: 'error',
        title: 'Error',
        text: 'Failed to update order status'
      });
    }
  }
  function viewOrderDetails(orderNumber) {
    const order = adminDataManager.getOrderDetails(orderNumber);
    if (!order) {
      Swal.fire('Error', 'Order not found', 'error');
      return;
    }
    const itemsList = order.items.map(item => `
      <div class="d-flex justify-content-between border-bottom py-2">
        <div>
          <strong>${item.name}</strong><br>
          <small>Qty: ${item.quantity} × ${item.price} EGP</small>
        </div>
        <div><strong>${item.quantity * item.price} EGP</strong></div>
      </div>
    `).join('');
    Swal.fire({
      title: `Order ${order.orderNumber}`,
      html: `
        <div class="text-start">
          <p><strong>Customer:</strong> ${order.customerName}</p>
          <p><strong>Email:</strong> ${order.email}</p>
          <p><strong>Phone:</strong> ${order.phone}</p>
          <p><strong>Address:</strong> ${order.address}</p>
          <p><strong>Status:</strong> <span class="badge bg-primary">${order.status}</span></p>
          <hr>
          <h6>Items:</h6>
          ${itemsList}
          <hr>
          <div class="d-flex justify-content-between">
            <strong>Subtotal:</strong>
            <strong>${order.subtotal} EGP</strong>
          </div>
          <div class="d-flex justify-content-between">
            <strong>Shipping:</strong>
            <strong>${order.shipping} EGP</strong>
          </div>
          <div class="d-flex justify-content-between mt-2 pt-2 border-top">
            <strong>Total:</strong>
            <strong>${order.total} EGP</strong>
          </div>
        </div>
      `,
      width: 600,
      confirmButtonColor: '#6c63ff'
    });
  }
  function deleteOrder(orderNumber) {
    Swal.fire({
      title: 'Delete Order?',
      text: `Are you sure you want to delete order ${orderNumber}?`,
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#6c63ff',
      confirmButtonText: 'Yes, delete it!'
    }).then((result) => {
      if (result.isConfirmed) {
        if (adminDataManager.deleteOrderAdmin(orderNumber)) {
          Swal.fire('Deleted!', 'Order has been deleted.', 'success');
          loadAllOrders();
        } else {
          Swal.fire('Error', 'Failed to delete order', 'error');
        }
      }
    });
  }
  function logoutAdmin() {
    localStorage.removeItem('loggedInUser');
    localStorage.removeItem('isLoggedIn');
    window.location.href = '../pages/Login-Customer.html';
  }
  const searchInput = document.querySelector('.search input');
  if (searchInput) {
    searchInput.addEventListener('input', function() {
      const query = this.value.trim();
      if (query === '') {
        loadAllOrders();
      } else {
        const results = adminDataManager.searchOrders(query);
        displaySearchResults(results);
      }
    });
  }
  function displaySearchResults(orders) {
    const tbody = document.getElementById('ordersTableBody');
    tbody.innerHTML = '';
    if (orders.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="text-center py-4">
            <p class="text-muted">No orders found matching your search</p>
          </td>
        </tr>
      `;
      return;
    }
    orders.forEach(order => {
      const statusClass = getStatusClass(order.status);
      const row = document.createElement('tr');
      row.innerHTML = `
        <td><strong>${order.orderNumber}</strong></td>
        <td>${order.customerName}</td>
        <td>${order.email}</td>
        <td>${adminDataManager.formatDateAdmin(order.orderDate)}</td>
        <td><strong>${adminDataManager.formatCurrency(order.total)}</strong></td>
        <td>
          <select class="form-select form-select-sm status-select ${statusClass}" 
                  data-order="${order.orderNumber}" 
                  onchange="updateOrderStatus(this)">
            <option value="Pending" ${order.status === 'Pending' ? 'selected' : ''}>Pending</option>
            <option value="Processing" ${order.status === 'Processing' ? 'selected' : ''}>Processing</option>
            <option value="Shipped" ${order.status === 'Shipped' ? 'selected' : ''}>Shipped</option>
            <option value="Delivered" ${order.status === 'Delivered' ? 'selected' : ''}>Delivered</option>
            <option value="Cancelled" ${order.status === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
          </select>
        </td>
        <td>
          <button class="btn btn-sm btn-info" onclick="viewOrderDetails('${order.orderNumber}')">
            <i class="bi bi-eye"></i>
          </button>
          <button class="btn btn-sm btn-danger" onclick="deleteOrder('${order.orderNumber}')">
            <i class="bi bi-trash"></i>
          </button>
        </td>
      `;
      tbody.appendChild(row);
    });
  }
</script>
  </body>
</html>
